[project]
name = "rnd-manual-rag-mcp"
version = "0.1.0"
description = "정부과제 매뉴얼 기반 RAG 검색 도구"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "sqlite-utils",
    "sqlite-vec",
    "numpy",
    "openai",
    "python-dotenv",
    "mcp",
]

# 배포본은 검색과 MCP 만 쓴다. 에이전트는 벤치마크에서만 돌아간다
[project.optional-dependencies]
eval = [
    "anthropic>=1.6",  # output_config 구조화 출력
    "langgraph>=1.0",
]

[project.scripts]
rag-build = "rnd_rag.cli.build_chunks:main"
rag-index = "rnd_rag.cli.build_index:main"
rag-mcp = "rnd_rag.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rnd_rag"]
