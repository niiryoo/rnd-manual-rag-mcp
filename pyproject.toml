[project]
name = "rnd-manual-rag-mcp"
version = "0.1.0"
description = "정부과제 매뉴얼 기반 RAG 검색 도구"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "sqlite-utils",
    "sqlite-vec",
    "numpy",
    "openai",
    "python-dotenv",
    "mcp",
]

[project.scripts]
rag-build = "rnd_rag.cli.build_chunks:main"
rag-index = "rnd_rag.cli.build_index:main"
rag-mcp = "rnd_rag.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rnd_rag"]
